name: Release addon zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package addon and worker
        run: |
          # Use the same script developers run locally so the released ZIPs are
          # byte-identical to the verified ones. The addon
          # (addons/python_bridge/) stays at the top of the ZIP so extracting it
          # into a project lands the plugin in addons/python_bridge/.
          chmod +x versions/build_zips.sh
          ./versions/build_zips.sh

      - name: Show packages
        run: |
          ls -l versions/*.zip
          cat versions/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versions/*.zip
            versions/SHA256SUMS.txt
            versions/RELEASE_NOTES_*.md
          generate_release_notes: true
