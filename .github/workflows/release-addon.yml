name: Release addon zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package addon
        run: |
          # addons/python_bridge/ must stay at the top of the ZIP so extracting
          # it into a project lands the plugin in addons/python_bridge/.
          zip -r python_bridge_addon.zip addons/python_bridge/ -x '*/__pycache__/*' '*.pyc' '*.pyo'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: python_bridge_addon.zip
          generate_release_notes: true
