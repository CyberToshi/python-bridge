[plugin]

name="Python Bridge"
description="Run Python inside Godot 4: native on Windows/Linux via managed WebSocket process instances, in the browser via Pyodide/WebAssembly. Auto venv, frame-synced calls, task batching/backpressure, health monitoring, crash restart, wrapper generation, hot reload and export checks for Windows, Linux and Web. In-editor Python dock with reliable tabs, stable highlighting, temporary scratch scripts and artifact-free script deletion."
author="CyberToshi"
version="0.5.0"
script="plugin.gd"
